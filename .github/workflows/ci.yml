# GitHub Actions CI for the f2cl regression suite.
#
# Runs the ASDF flow under SBCL on a stock ubuntu-latest runner.
# (The GitLab CI side, in .gitlab-ci.yml, exercises both ASDF and
# mk-defsystem under CMUCL; this workflow covers the SBCL side.
# mk-defsystem isn't tested here because SBCL doesn't bundle it and
# pulling it in via Quicklisp would risk Quicklisp's older "rt"
# system shadowing our vendored copy.)
#
# The job exits non-zero when the test runner signals on unexpected
# outcomes -- both by SBCL's --non-interactive default behavior on
# unhandled errors and by the explicit (sb-ext:exit :code 1) in the
# handler-case branch.

name: CI

on:
  push:
    branches: [ master, "issue-*" ]
  pull_request:
    branches: [ master ]

jobs:
  asdf-tests:
    name: ASDF / SBCL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sbcl

      - name: Show SBCL version
        run: sbcl --version

      # Run the ASDF flow.  The eval-when block at the top of f2cl.asd
      # self-registers our vendored "rt" system and adds packages/ to
      # asdf:*central-registry*, so only the repo root needs to be on
      # the registry.
      - name: Run f2cl regression suite
        run: |
          sbcl --non-interactive --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(handler-case
                       (progn
                         (setf asdf:*compile-file-warnings-behaviour* :ignore
                               asdf:*compile-file-failure-behaviour*  :ignore)
                         (push (truename "./") asdf:*central-registry*)
                         (asdf:test-system :f2cl)
                         (sb-ext:exit :code 0))
                     (error (c)
                       (format *error-output* "~&FAIL: ~A~%" c)
                       (sb-ext:exit :code 1)))'

      # Run the fortran-format corpus suite in a fresh Lisp.  Kept
      # separate from f2cl/tests above because f2cl/fortran-format/tests
      # populates rt:*expected-failures* from its corpus
      # expected-failures.lisp files, and the existing regression
      # tests in regression/tests.lisp SETF the variable, which would
      # clobber the corpus registrations if both ran in the same
      # image.
      - name: Run fortran-format corpus suite
        run: |
          sbcl --non-interactive --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(handler-case
                       (progn
                         (setf asdf:*compile-file-warnings-behaviour* :ignore
                               asdf:*compile-file-failure-behaviour*  :ignore)
                         (push (truename "./") asdf:*central-registry*)
                         (asdf:test-system :f2cl/fortran-format)
                         (sb-ext:exit :code 0))
                     (error (c)
                       (format *error-output* "~&FAIL: ~A~%" c)
                       (sb-ext:exit :code 1)))'

      # MINPACK rt-tests, one driver per fresh-SBCL step (each
      # --eval'd sbcl invocation is a separate process, so the
      # FCN/INITPT/SSQFCN definitions from one driver's tst-*.f
      # don't leak into the next).  Each step does
      # (asdf:load-system "f2cl") first to trigger the registry
      # side-effect in f2cl.asd that makes packages/ findable;
      # without it ASDF can't locate packages/minpack.asd to
      # resolve the rt-tests-* systems.
      #
      # The use of string system names ("f2cl" vs :f2cl) is
      # deliberate: under SBCL the keyword form
      # (asdf:load-system :f2cl) fails with "Component :F2CL not
      # found", while "f2cl" works.
      - name: Run MINPACK rt-tests-hybrd
        run: |
          sbcl --non-interactive --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(handler-case
                       (progn
                         (setf asdf:*compile-file-warnings-behaviour* :ignore
                               asdf:*compile-file-failure-behaviour*  :ignore)
                         (push (truename "./") asdf:*central-registry*)
                         (asdf:load-system "f2cl")
                         (asdf:test-system "minpack/rt-tests-hybrd")
                         (sb-ext:exit :code 0))
                     (error (c)
                       (format *error-output* "~&FAIL: ~A~%" c)
                       (sb-ext:exit :code 1)))'

      # TST-LMDIF-25 (NPROB=10, Meyer function, finite-difference
      # Jacobian) is registered in tst-lmdif-test.lisp as a
      # #+sbcl expected failure: SBCL hits the iteration limit
      # (INFO=3) on this badly-conditioned problem where gfortran
      # reports convergence (INFO=1).  All other 52 rows pass.
      - name: Run MINPACK rt-tests-lmdif
        run: |
          sbcl --non-interactive --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(handler-case
                       (progn
                         (setf asdf:*compile-file-warnings-behaviour* :ignore
                               asdf:*compile-file-failure-behaviour*  :ignore)
                         (push (truename "./") asdf:*central-registry*)
                         (asdf:load-system "f2cl")
                         (asdf:test-system "minpack/rt-tests-lmdif")
                         (sb-ext:exit :code 0))
                     (error (c)
                       (format *error-output* "~&FAIL: ~A~%" c)
                       (sb-ext:exit :code 1)))'

      - name: Run MINPACK rt-tests-lmder
        run: |
          sbcl --non-interactive --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(handler-case
                       (progn
                         (setf asdf:*compile-file-warnings-behaviour* :ignore
                               asdf:*compile-file-failure-behaviour*  :ignore)
                         (push (truename "./") asdf:*central-registry*)
                         (asdf:load-system "f2cl")
                         (asdf:test-system "minpack/rt-tests-lmder")
                         (sb-ext:exit :code 0))
                     (error (c)
                       (format *error-output* "~&FAIL: ~A~%" c)
                       (sb-ext:exit :code 1)))'

      # Upload .log artifacts produced by %f2cl-asd-run-rt-tests
      # so CI failures can be diagnosed from the run output.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: '*.log'
          if-no-files-found: ignore

  # MINPACK rt-tests under clisp.  Smaller scope than the SBCL job
  # above -- this only exercises the three minpack drivers, not the
  # core f2cl/tests suite -- because that's where the cross-impl
  # numerical behavior is most interesting.  All three drivers pass
  # cleanly under clisp.
  minpack-clisp:
    name: MINPACK / clisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clisp
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clisp

      - name: Show clisp version
        run: clisp --version

      - name: Run MINPACK rt-tests-hybrd
        run: |
          clisp -q -norc -E utf-8 \
            -x '(load "/usr/share/common-lisp/source/cl-asdf/asdf.lisp")
                (handler-case
                    (progn
                      (setf asdf:*compile-file-warnings-behaviour* :ignore
                            asdf:*compile-file-failure-behaviour*  :ignore)
                      (push (truename "./") asdf:*central-registry*)
                      (asdf:load-system "f2cl")
                      (asdf:test-system "minpack/rt-tests-hybrd")
                      (ext:quit 0))
                  (error (c)
                    (format *error-output* "~&FAIL: ~A~%" c)
                    (ext:quit 1)))'

      - name: Run MINPACK rt-tests-lmdif
        run: |
          clisp -q -norc -E utf-8 \
            -x '(load "/usr/share/common-lisp/source/cl-asdf/asdf.lisp")
                (handler-case
                    (progn
                      (setf asdf:*compile-file-warnings-behaviour* :ignore
                            asdf:*compile-file-failure-behaviour*  :ignore)
                      (push (truename "./") asdf:*central-registry*)
                      (asdf:load-system "f2cl")
                      (asdf:test-system "minpack/rt-tests-lmdif")
                      (ext:quit 0))
                  (error (c)
                    (format *error-output* "~&FAIL: ~A~%" c)
                    (ext:quit 1)))'

      - name: Run MINPACK rt-tests-lmder
        run: |
          clisp -q -norc -E utf-8 \
            -x '(load "/usr/share/common-lisp/source/cl-asdf/asdf.lisp")
                (handler-case
                    (progn
                      (setf asdf:*compile-file-warnings-behaviour* :ignore
                            asdf:*compile-file-failure-behaviour*  :ignore)
                      (push (truename "./") asdf:*central-registry*)
                      (asdf:load-system "f2cl")
                      (asdf:test-system "minpack/rt-tests-lmder")
                      (ext:quit 0))
                  (error (c)
                    (format *error-output* "~&FAIL: ~A~%" c)
                    (ext:quit 1)))'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-clisp
          path: '*.log'
          if-no-files-found: ignore

  # MINPACK rt-tests under ECL.  See *close-enough-abs-floor* in
  # minpack-tests-helpers.lisp for the ECL-specific noise floor
  # (1d-8) needed to absorb iteration-path drift on hybrd; the
  # standard floor (1.5d-12) keeps the other implementations strict.
  # Like SBCL, ECL also requires the #+(or sbcl ecl) xfail on
  # TST-LMDIF-25 (Meyer function, INFO=3 vs gfortran's INFO=1).
  minpack-ecl:
    name: MINPACK / ECL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ECL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ecl

      - name: Show ECL version
        run: ecl --version

      - name: Run MINPACK rt-tests-hybrd
        run: |
          ecl --norc \
            -eval '(require :asdf)' \
            -eval '(handler-case
                      (progn
                        (setf asdf:*compile-file-warnings-behaviour* :ignore
                              asdf:*compile-file-failure-behaviour*  :ignore)
                        (push (truename "./") asdf:*central-registry*)
                        (asdf:load-system "f2cl")
                        (asdf:test-system "minpack/rt-tests-hybrd")
                        (ext:quit 0))
                    (error (c)
                      (format *error-output* "~&FAIL: ~A~%" c)
                      (ext:quit 1)))'

      - name: Run MINPACK rt-tests-lmdif
        run: |
          ecl --norc \
            -eval '(require :asdf)' \
            -eval '(handler-case
                      (progn
                        (setf asdf:*compile-file-warnings-behaviour* :ignore
                              asdf:*compile-file-failure-behaviour*  :ignore)
                        (push (truename "./") asdf:*central-registry*)
                        (asdf:load-system "f2cl")
                        (asdf:test-system "minpack/rt-tests-lmdif")
                        (ext:quit 0))
                    (error (c)
                      (format *error-output* "~&FAIL: ~A~%" c)
                      (ext:quit 1)))'

      - name: Run MINPACK rt-tests-lmder
        run: |
          ecl --norc \
            -eval '(require :asdf)' \
            -eval '(handler-case
                      (progn
                        (setf asdf:*compile-file-warnings-behaviour* :ignore
                              asdf:*compile-file-failure-behaviour*  :ignore)
                        (push (truename "./") asdf:*central-registry*)
                        (asdf:load-system "f2cl")
                        (asdf:test-system "minpack/rt-tests-lmder")
                        (ext:quit 0))
                    (error (c)
                      (format *error-output* "~&FAIL: ~A~%" c)
                      (ext:quit 1)))'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ecl
          path: '*.log'
          if-no-files-found: ignore
